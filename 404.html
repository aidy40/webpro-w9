
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#eeeae0">
    <title>404 — Page Not Found | CHINGUN</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&family=Space+Grotesk:wght@500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 25px;
            background: #eeeae0;
            color: #171717;
            font-family: 'DM Sans', sans-serif;
        }

        .error-card {
            position: relative;
            width: min(650px, 100%);
            padding: 55px 45px;
            background: #faf8f2;
            border: 1px solid #d5d0c5;
            border-top: 7px solid #f04435;
        }

        .top-label {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            padding-bottom: 18px;
            border-bottom: 1px solid #d5d0c5;
            color: #77746d;
            font-family: 'Space Mono', monospace;
            font-size: 10px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .error-number {
            margin: 45px 0 5px;
            color: #293fda;
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(100px, 22vw, 170px);
            font-weight: 700;
            letter-spacing: -12px;
            line-height: .9;
        }

        h2 {
            margin: 30px 0 15px;
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(27px, 5vw, 38px);
            letter-spacing: -1.5px;
            text-transform: uppercase;
        }

        h2 span {
            color: #f04435;
        }

        p {
            max-width: 430px;
            margin: 0;
            color: #77746d;
            font-size: 14px;
            line-height: 1.9;
        }

        .error-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 40px;
            padding-top: 25px;
            border-top: 1px solid #d5d0c5;
        }

        .home-link {
            display: inline-flex;
            align-items: center;
            gap: 25px;
            padding: 15px 22px;
            background: #f04435;
            color: white;
            font-family: 'Space Mono', monospace;
            font-size: 10px;
            font-weight: 700;
            text-decoration: none;
            text-transform: uppercase;
            transition: .25s ease;
        }

        .home-link:hover {
            background: #171717;
            transform: translateY(-3px);
        }

        .home-link span {
            font-size: 17px;
        }

        .footer-note {
            color: #77746d;
            font-family: 'Space Mono', monospace;
            font-size: 9px;
        }

        @media (max-width: 480px) {
            .error-card {
                padding: 35px 25px;
            }

            .error-number {
                letter-spacing: -7px;
            }

            .top-label {
                font-size: 8px;
            }
        }
    </style>
</head>

<body>

    <main class="error-card">

        <div class="top-label">
            <span>CHINGUN / PORTFOLIO</span>
            <span>ERROR 404</span>
        </div>

        <h1 class="error-number">404.</h1>

        <h2>Page not <span>found.</span></h2>

        <p>
            Looks like you've wandered into the wrong place.
            The page you're looking for doesn't exist or may
            have been moved.
        </p>

        <div class="error-footer">
            <a href="./" class="home-link">
                Back to home <span>↗</span>
            </a>

            <span class="footer-note">END OF THE LINE — 404</span>
        </div>

    </main>

</body>
</html>
